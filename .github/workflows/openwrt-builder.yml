name: Build OneCloud OpenWrt

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-code-update]

permissions:
  contents: write

concurrency:
  group: onecloud-openwrt-build
  cancel-in-progress: false

env:
  OPENWRT_REPO: https://github.com/coolsnowwolf/lede.git
  OPENWRT_COMMIT: 9262b55e09d9dc74024a8effb2b26512b100ef96
  OPENCLASH_REPO: https://github.com/vernesong/OpenClash.git
  OPENCLASH_COMMIT: c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install $(<dependson)
          sudo apt-get -qq install android-sdk-libsparse-utils
          sudo apt-get -qq clean

      - name: Checkout pinned OpenWrt source
        run: |
          sudo mkdir -p /workdir
          sudo chown "${USER}:$(id -gn)" /workdir
          git -C /workdir init openwrt
          git -C /workdir/openwrt remote add origin "${OPENWRT_REPO}"
          git -C /workdir/openwrt fetch --depth 1 origin "${OPENWRT_COMMIT}"
          git -C /workdir/openwrt checkout --detach FETCH_HEAD
          test "$(git -C /workdir/openwrt rev-parse HEAD)" = "${OPENWRT_COMMIT}"
          ln -s /workdir/openwrt "${GITHUB_WORKSPACE}/openwrt"

      - name: Add pinned OpenClash package
        working-directory: openwrt
        run: "${GITHUB_WORKSPACE}/diy-part1.sh"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          cp "${GITHUB_WORKSPACE}/feeds.conf.default" feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load OneCloud configuration
        run: |
          cp .config openwrt/.config
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          cd openwrt
          "${GITHUB_WORKSPACE}/diy-part2.sh"
          make defconfig
          grep -q '^CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-homeproxy|luci-app-dockerman)=y$' .config; then
            echo 'Unexpected package found in final configuration.' >&2
            exit 1
          fi

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 || make download -j1 V=s
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Generate OneCloud burn image
        run: |
          chmod +x AmlImg
          ./gen_burn_img.sh

      - name: Prepare artifacts
        id: artifacts
        run: |
          target_dir='openwrt/bin/targets/amlogic/meson8b'
          test -d "${target_dir}"
          rm -rf "${target_dir}/packages"
          cp openwrt/.config "${target_dir}/config.full"
          printf '%s\n' \
            "OpenWrt: ${OPENWRT_REPO}@${OPENWRT_COMMIT}" \
            "OpenClash: ${OPENCLASH_REPO}@${OPENCLASH_COMMIT}" \
            > "${target_dir}/source-revisions.txt"
          echo "target_dir=${target_dir}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=onecloud-$(date +'%Y.%m.%d-%H%M')-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: onecloud-openwrt-${{ github.run_number }}
          path: ${{ steps.artifacts.outputs.target_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: OneCloud OpenWrt ${{ steps.artifacts.outputs.release_tag }}
          body: |
            OneCloud single-port side-router firmware with OpenClash.

            LAN: 192.168.10.2/24
            Upstream gateway: 192.168.10.1
            DHCP server: disabled
          files: ${{ steps.artifacts.outputs.target_dir }}/*
          fail_on_unmatched_files: true
